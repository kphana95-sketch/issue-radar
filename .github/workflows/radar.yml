name: Hourly Issue Radar

on:
  schedule:
    # 한국 시간 기준 주말(토/일) 09:12 ~ 22:12 매시각 12분 실행
    # KST 09:12 ~ 22:12 == UTC 00:12 ~ 13:12
    # UTC 기준 토(6), 일(0)
    - cron: '12 0-13 * * 0,6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 google-genai

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python main.py

      - name: Commit and push sent history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_history.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sent articles history [skip ci]" && git push)
