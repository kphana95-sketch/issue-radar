name: Issue Radar Scheduler

on:
  workflow_dispatch: # 수동 실행 버튼 활성화
  schedule:
    # [평일: 월~금 / 19시, 21시, 23시]
    # KST 19:00 -> UTC 10:00 (월~금)
    - cron: '0 10 * * 1-5'
    # KST 21:00 -> UTC 12:00 (월~금)
    - cron: '0 12 * * 1-5'
    # KST 23:00 -> UTC 14:00 (월~금)
    - cron: '0 14 * * 1-5'

    # [주말: 토, 일 / 12시, 15시, 18시, 21시]
    # KST 12:00 -> UTC 03:00 (토, 일)
    - cron: '0 3 * * 0,6'
    # KST 15:00 -> UTC 06:00 (토, 일)
    - cron: '0 6 * * 0,6'
    # KST 18:00 -> UTC 09:00 (토, 일)
    - cron: '0 9 * * 0,6'
    # KST 21:00 -> UTC 12:00 (토, 일)
    - cron: '0 12 * * 0,6'

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python main.py
