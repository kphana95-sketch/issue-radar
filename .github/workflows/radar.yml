name: Issue Radar Scheduler

on:
  workflow_dispatch: # 수동 실행 버튼 활성화
  schedule:
    # [평일: 월~금 / 19시~23시 매시간 (19:02, 20:02, 21:02, 22:02, 23:02)]
    # KST 19:02~23:02 -> UTC 10:02~14:02 (월~금, 요일 1-5)
    - cron: '2 10-14 * * 1-5'

    # [주말: 토, 일 / 12시, 15시, 18시, 21시 (기존 유지)]
    # KST 12:02 -> UTC 03:02 (토, 일)
    - cron: '2 3 * * 0,6'
    # KST 15:02 -> UTC 06:02 (토, 일)
    - cron: '2 6 * * 0,6'
    # KST 18:02 -> UTC 09:02 (토, 일)
    - cron: '2 9 * * 0,6'
    # KST 21:02 -> UTC 12:02 (토, 일)
    - cron: '2 12 * * 0,6'

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python main.py
